<!--shell.html-->

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CW</title>
  <link rel="preconnect" href="https://rsms.me">
  <link rel="stylesheet" href="https://rsms.me/inter/inter.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/core@1.4.0/dist/css/tabler.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css">
  <style>
    #main_container:empty,
    #left_pane:empty,
    #right_pane:empty { display: none; }
    .threads-left  { height: 100vh; overflow-y: auto; border-right: 1px solid var(--tblr-border-color); }
    .threads-right { height: 100vh; overflow-y: auto; }
    .cw-universal-grid table { table-layout: fixed; width: 100%; }
    .cw-universal-grid td, .cw-universal-grid th { word-wrap: break-word; white-space: normal; }
  </style>
</head>
<body class="antialiased">
  <div id="nav_container"></div>
  <div class="container-xl py-3">
    <div id="main_container"></div>
    <div class="row g-0">
      <div class="col-md-3 threads-left"  id="left_pane"></div>
      <div class="col-md-9 threads-right" id="right_pane"></div>
    </div>
  </div>
  <div id="toast_container"></div>

  <!-- ── 1. UMD libs ── -->
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@tabler/core@1.0.0-beta17/dist/js/tabler.min.js"></script>
  <script src="https://unpkg.com/@tanstack/react-table@8.20.5/build/umd/index.production.js"></script>
  <script>globalThis.TanStackTable = globalThis.ReactTable;</script>

  <!-- ── 2. CW framework ── -->
  <script src="/CW-state.js"></script>
  <script src="/CW-config.js"></script>
  <script src="/CW-utils.js"></script>
  <script src="/CW-run.js"></script>
  <script src="/CW-adapter-d1.js"></script>
  <script src="/CW-ui.js"></script>
  <script src="/CW-monaco.js"></script>
  <script src="/CW-url.js"></script>
  <script src="/app-ui.js"></script>

  <!-- ── 3. DO NOT USE ── -->
  <script src="/boot.js"></script>  

<script>
  // extract OAuth token from URL hash after Google/LinkedIn redirect
  const _oauthToken = new URLSearchParams(window.location.hash.slice(1)).get('token')
  if (_oauthToken) {
    const _payload = JSON.parse(atob(_oauthToken.split('.')[1]))
    globalThis.currentUser = { ..._payload, token: _oauthToken }
    localStorage.setItem('currentUser', JSON.stringify(globalThis.currentUser))
    window.history.replaceState({}, '', window.location.pathname)
  }

  // restore currentUser from localStorage on page load
  if (!globalThis.currentUser) {
    const _stored = localStorage.getItem('currentUser')
    if (_stored) {
      try { globalThis.currentUser = JSON.parse(_stored) } catch {}
    }
  }

  window.addEventListener('CW:booted', () => cwStateFromUrl())
</script>


</body>
</html>
